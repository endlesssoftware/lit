# An annotated suite config for a compiler test suite on OpenVMS.
#
#   $ LIT :== "PERL DISK$TOOLS:[LIT.BIN]LIT.PL"
#   $ LIT -v --param build=DISK$SCRATCH:[BUILD] [.TEST]

$config->name('brcob');
$config->suffixes('.cob', '.pli');

$config->test_source_root($config->dir);

# Keep scratch output out of the source tree.  Note the Unix syntax: paths
# are held that way internally and converted only when handed to a native
# tool.
my $build = $lit_config->param('build', $config->dir);
$config->test_exec_root($build . '/test');

# The tool under test.  %brcob expands to a native path, so the DCL
# backend can turn it into a foreign command.
$config->add_substitution('%brcob',
    $lit_config->param('brcob', 'SYS$SYSTEM:BRCOB.EXE'));

# Architecture-specific expectations.  vax/alpha/ia64/x86_64 are added
# automatically from the host, so tests can say
#     UNSUPPORTED: vax
# without any help from here.
$config->add_feature('have-cics') if $lit_config->param('cics', 0);
$config->add_feature('slow-host')  if $lit_config->is_vms;

# VMS has no fork(), so per-test timeouts are unavailable there; leave the
# limit off rather than have it silently ignored.
$config->timeout(0) if $lit_config->is_vms;

# A pipeline reports failure if any stage fails.  Turn this off for suites
# written against a shell that does not set pipefail.
$config->pipefail(1);
